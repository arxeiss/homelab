# Shared base for every device. Include via:
#   packages:
#     base: !include ../../common/base.yaml
# Requires substitutions: name, friendly_name

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback hotspot if WiFi fails
  ap:
    ssid: ${name}-fallback
    password: !secret fallback_ap_password

captive_portal:

sensor:
  - platform: wifi_signal
    name: WiFi signal
    update_interval: 60s
  - platform: uptime
    name: Uptime

text_sensor:
  - platform: version
    name: ESPHome version

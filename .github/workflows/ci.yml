name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks scans history
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      # pre-commit/action is unmaintained (pins Node 20 actions/cache@v4), so run pre-commit directly.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: pre-commit
        run: |
          pip install -q pre-commit
          pre-commit run --all-files --show-diff-on-failure --color=always
      - name: network/inventory.md is up to date
        run: |
          pip install -q pyyaml
          python scripts/inventory.py markdown inventory.yaml -o network/inventory.md
          git diff --exit-code network/inventory.md || {
            echo "::error::network/inventory.md is stale - run 'make generate' and commit"; exit 1; }

  esphome:
    name: Validate ESPHome configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use dummy secrets
        run: cp esphome/secrets.example.yaml esphome/secrets.yaml
      - name: esphome config
        run: |
          for dir in esphome/devices/*/; do
            dev=$(basename "$dir")
            echo "::group::$dev"
            docker run --rm -v "$PWD/esphome":/config ghcr.io/esphome/esphome:stable \
              config "devices/$dev/$dev.yaml" > /dev/null
            echo "::endgroup::"
          done

site_name: homelab
site_description: Documentation of my home network, servers and Home Assistant setup
site_url: https://arxeiss.github.io/homelab/
repo_url: https://github.com/arxeiss/homelab
edit_uri: edit/master/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Network:
      - Overview: network/overview.md
      - Inventory: generated/inventory.md
      - MikroTik router: network/mikrotik.md
      - UniFi: network/unifi.md
  - Servers:
      - Proxmox: servers/proxmox.md
      - Backups: servers/backups.md
      - Runbooks:
          - Replace the router: servers/runbooks/replace-router.md
          - Restore Proxmox host: servers/runbooks/restore-proxmox.md
  - Home Assistant:
      - home-assistant/index.md
      - ESPHome: esphome/index.md
      - ESPHome devices: generated/esphome-devices.md
